name: "CLA Assistant"
on:
  workflow_call:
    secrets:
      APP_PRIVATE_KEY:
        description: "Private key of the steadybit GitHub App. When set, the signatures are committed with a one-hour app token"
        required: false
      PERSONAL_ACCESS_TOKEN:
        description: "Deprecated: personal access token with repo scope. Used only when APP_PRIVATE_KEY is not set"
        required: false
jobs:
  CLAssistant:
    runs-on: ubuntu-latest
    env:
      RUN_CLA: ${{ (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target' }}
      HAS_APP_KEY: ${{ secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - name: Token for the signatures repository
        id: app-token
        if: env.RUN_CLA == 'true' && env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.GH_APP_STEADYBIT_APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: steadybit
          repositories: .github
          permission-contents: write

      - name: "CLA Assistant"
        if: env.RUN_CLA == 'true'
        # Beta Release
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # commits the signature to steadybit/.github: the app token when available, else the personal token
          PERSONAL_ACCESS_TOKEN: ${{ steps.app-token.outputs.token || secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: '.github/cla/signatures.json'
          path-to-document: 'https://github.com/steadybit/.github/blob/main/.github/cla/individual-cla.md' # e.g. a CLA or a DCO document
          custom-notsigned-prcomment: '<br/><br/>Thank you for your submission - we really appreciate it ❤️. We kindly ask that $you sign a [Contributor License Agreement](https://github.com/steadybit/.github/blob/main/.github/cla/individual-cla.md) before we can accept your contribution.<br/><br/>You can sign the CLA by just posting a Pull Request Comment, the same as the text below.<br/><br/>If you are contributing on behalf of a company, your company should contact us to sign a [Corporate Contributor License Agreement](https://github.com/steadybit/.github/blob/main/.github/cla/corporate-cla.md), via hello@steadybit.com.'
          remote-repository-name: .github
          # branch should not be protected
          branch: 'main'
          # team-o: TheNavigat,daniejtoja,guillermolopezmartin-okta,shepbook,junajiffle
          # team-s: jay-hankins,knuta,joeyb,kpalati,singhshivani1
          # team-r: tomh-rbx, peter-welander
          allowlist: 'Zha0ze,joshiste,bertschneider,ReuDa,MrBW,ManuelGerding,guendaaa,TheNavigat,daniejtoja,guillermolopezmartin-okta,shepbook,junajiffle,jay-hankins,knuta,joeyb,kpalati,singhshivani1,tomh-rbx,peter-welander,dependabot[bot],greenkeeper[bot]'
          signed-commit-message: '$contributorName has signed the CLA in $owner/$repo#$pullRequestNo'

          #below are the optional inputs - If the optional inputs are not given, then default values will be taken
          #remote-organization-name: enter the remote organization name where the signatures should be stored (Default is storing the signatures in the same repository)
          #create-file-commit-message: 'For example: Creating file for storing CLA Signatures'
          #custom-pr-sign-comment: 'The signature to be committed in order to sign the CLA'
          #custom-allsigned-prcomment: 'pull request comment when all contributors has signed, defaults to **CLA Assistant Lite bot** All Contributors have signed the CLA.'
          #lock-pullrequest-aftermerge: false - if you don't want this bot to automatically lock the pull request after merging (default - true)
          #use-dco-flag: true - If you are using DCO instead of CLA
